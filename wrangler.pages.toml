# Cloudflare Pages deploy (cloud map saves: D1 + R2 + functions/).
# Local: npm run pages:dev  (placeholder database_id is fine for --local)
# Remote: replace database_id after `npx wrangler d1 create galaxy-map-saves`
#
# Required Pages env (production):
#   CF_ACCESS_TEAM_DOMAIN, CF_ACCESS_AUD
# Optional local (.dev.vars):
#   DEV_AUTH_EMAIL

name = "galaxy-map-maker"
compatibility_date = "2025-11-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "galaxy-map-saves"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MAPS"
bucket_name = "galaxy-map-saves"
